name: primentoring

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

x-backend-env: &backend-env
  env_file: .env
  networks:
    - internal

services:

  # ─────────────────────────────────────────
  # CORE INFRASTRUCTURE (always on)
  # ─────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talkinghead}
      POSTGRES_USER: ${POSTGRES_USER:-thuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thpassword}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.9.2
    <<: *default-restart
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging: *default-logging

  redis:
    image: redis:7-alpine
    <<: *default-restart
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    logging: *default-logging

  nginx:
    image: nginx:1.25-alpine
    <<: *default-restart
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - avatar_output:/var/www/avatars:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
    logging: *default-logging
    profiles: ["app"]

  # ─────────────────────────────────────────
  # APPLICATION SERVICES (profile: app)
  # ─────────────────────────────────────────

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    <<: [*default-restart, *backend-env]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - avatar_output:/app/static/avatars
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    logging: *default-logging

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    <<: *default-restart
    environment:
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    networks:
      - internal
    logging: *default-logging

  celery-worker:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    <<: [*default-restart, *backend-env]
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2 -Q transcripts,default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  celery-beat:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    <<: [*default-restart, *backend-env]
    command: celery -A workers.celery_app beat --loglevel=info
    depends_on:
      - redis
    networks:
      - internal
    logging: *default-logging

  # ─────────────────────────────────────────
  # LOCAL AI SERVICES (profile: local-ai)
  # ─────────────────────────────────────────

  whisper:
    profiles: ["local-ai"]
    build:
      context: ./ai-services/whisper
    <<: *default-restart
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal
    logging: *default-logging
    # Uncomment for NVIDIA GPU on Linux:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  coqui-tts:
    profiles: ["local-ai"]
    build:
      context: ./ai-services/coqui-tts
    <<: *default-restart
    environment:
      TTS_MODEL: ${TTS_MODEL:-tts_models/multilingual/multi-dataset/xtts_v2}
      TTS_DEVICE: ${TTS_DEVICE:-cpu}
      SPEAKER_WAV_URL: ${SPEAKER_WAV_URL:-}
    volumes:
      - tts_models:/root/.local/share/tts
      - ./data/speaker:/app/speaker:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks:
      - internal
    logging: *default-logging

  sadtalker:
    profiles: ["local-ai"]
    build:
      context: ./ai-services/sadtalker
    <<: *default-restart
    environment:
      SADTALKER_DEVICE: ${SADTALKER_DEVICE:-cpu}
      SADTALKER_STILL: ${SADTALKER_STILL:-true}
      SADTALKER_ENHANCER: ${SADTALKER_ENHANCER:-gfpgan}
    volumes:
      - sadtalker_models:/app/checkpoints
      - sadtalker_gfpgan:/app/gfpgan/weights
      - avatar_output:/app/results
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s
    networks:
      - internal
    logging: *default-logging
    # Uncomment for NVIDIA GPU on Linux:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─────────────────────────────────────────
  # LOCAL LLM (profile: llm-local)
  # ─────────────────────────────────────────

  ollama:
    profiles: ["llm-local"]
    image: ollama/ollama:latest
    <<: *default-restart
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal
    logging: *default-logging
    # Uncomment for NVIDIA GPU on Linux:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  whisper_models:
  tts_models:
  sadtalker_models:
  sadtalker_gfpgan:
  ollama_models:
  avatar_output:
