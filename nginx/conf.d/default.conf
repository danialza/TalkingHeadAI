server {
    listen 80;
    server_name _;

    # Large uploads for audio/video
    client_max_body_size 100M;

    # ── WebSocket — real-time conversation ──────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # ── Backend REST API ─────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── Avatar videos — served as static files ──────────
    # Both sadtalker and backend write to the shared avatar_output volume
    # nginx serves them directly without backend proxying
    location /static/avatars/ {
        alias /var/www/avatars/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Frontend (Next.js) ───────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
